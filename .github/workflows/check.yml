name: Check Beam

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # The app build number counts commits.
      - name: Build and run offline checks
        run: tooling/check.sh
      - name: Package universal app
        run: tooling/make-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Beam-macOS
          path: |
            build/Beam-*.zip
            build/Beam-*.sha256
          if-no-files-found: error
